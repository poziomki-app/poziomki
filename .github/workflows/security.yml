name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

# Top-level perms are the minimum. Scorecard's webapp publisher rejects
# uploads when workflow-level `security-events: write` is set — see the
# "workflow-restrictions" section of ossf/scorecard-action. Jobs that need
# to upload SARIF override with their own `permissions:` block.
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Trivy — only the `config` scan here. The `fs` scan was removed: for
  # Rust, cargo-deny (below) covers RUSTSEC + license + ban policy more
  # actionably; for mobile, there's no gradle.lockfile so fs scans
  # produced near-zero signal. We keep `config` because Hadolint doesn't
  # catch compose/k8s/terraform misconfigs that Trivy does.
  trivy:
    # Skip on PRs — runs on main push + weekly schedule. Config scan is
    # slow (Docker pull + SARIF upload) and findings are environmental,
    # not delta to a single PR.
    if: github.event_name != 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.70.0"
        run: |
          curl -sSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz trivy
          chmod +x trivy
          ./trivy --version
      - name: Scan repo config (Dockerfiles, compose, workflows)
        run: ./trivy config . --severity MEDIUM,HIGH,CRITICAL --format sarif --output trivy-config.sarif --exit-code 0
      - uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        if: always()
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  cargo-deny:
    # Same rationale as trivy: license/RUSTSEC drift surfaces on the
    # main push + weekly cron; no need to gate PRs on it.
    if: github.event_name != 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: backend/Cargo.toml
          command: check advisories licenses bans sources
          arguments: ""

  # gitleaks — secret detection. Installs the CLI directly (the
  # gitleaks-action marketplace variant has been unreliable) and uploads
  # SARIF to the Security tab.
  gitleaks:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GL_VERSION: "8.21.2"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          chmod +x gitleaks
      - name: Scan repo
        run: ./gitleaks detect --source . --report-format sarif --report-path gitleaks.sarif --exit-code 0
      - uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        if: always()
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  # Dependency Review — blocks PRs that introduce vulnerable or GPL-licensed
  # dependencies. Only fires on pull_request. Pinned to a specific release
  # (floating `@v4` has 404'd on stale SHAs before).
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: AGPL-1.0, AGPL-3.0, GPL-2.0, GPL-3.0

  # Hadolint — Dockerfile best-practice + security linter, SARIF to Security tab.
  hadolint:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          recursive: true
          format: sarif
          output-file: hadolint.sarif
          no-fail: true
      - uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        if: always()
        with:
          sarif_file: hadolint.sarif
          category: hadolint

  # Actionlint — catches common mistakes in .github/workflows YAMLs
  # (shellcheck integration, expression errors, deprecated actions).
  # Uses reviewdog so findings appear inline on the PR; actionlint has no
  # native SARIF output, so we skip the Security-tab upload for this one.
  actionlint:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      checks: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: reviewdog/action-actionlint@d63ba7532e0942965320cd8d73cbae4c7b3c5283 # v1.73.1
        with:
          reporter: github-check
          level: warning
          fail_level: error

  # OSSF Scorecard — open-source supply-chain health score (branch protection,
  # pinned deps, token permissions, etc.). Runs on schedule + default-branch
  # pushes; results flow to the Security tab.
  scorecard:
    # Weekly cron only — pushes to main don't need it (results are
    # repo-level posture, not per-commit signal).
    if: github.event_name == 'schedule'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        if: always()
        with:
          sarif_file: scorecard.sarif
          category: scorecard
